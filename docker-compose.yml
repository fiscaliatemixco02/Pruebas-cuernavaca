# docker-compose.yml  (va en la raíz del proyecto, junto a las carpetas backend y frontend)
#
# Tres piezas:
#   db       -> PostgreSQL (los datos viven en un volumen, no se pierden al actualizar)
#   backend  -> el servidor Node/Express
#   web      -> nginx: sirve el frontend y manda /api al backend (una sola dirección y un solo puerto)
#
# Todo se configura en el archivo .env (copia de .env.example).

name: fiscalia

services:
  db:
    image: postgres:${POSTGRES_VERSION:-17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Falta DB_USER en el archivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}
      POSTGRES_DB: ${DB_NAME:?Falta DB_NAME en el archivo .env}
      TZ: America/Mexico_City
    volumes:
      - datos-db:/var/lib/postgresql/data
      # Estos .sql se ejecutan UNA sola vez, la primera vez que se crea la base (en orden alfabético)
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: así solo responde cuando el servidor real ya arrancó (no el temporal de la carga inicial)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el archivo .env}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      ADMIN_CORREO: ${ADMIN_CORREO:-}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: America/Mexico_City
    volumes:
      # Aquí se guardan los PDF que suben los usuarios
      - archivos:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
        build:
          context: ./frontend
          args:
            VITE_API_URL: /api
        restart: unless-stopped
        depends_on:
          backend:
            condition: service_healthy
        ports:
          - "${PUERTO_WEB:-80}:80"
          - "443:443"
        volumes:
          - ./certs:/etc/nginx/certs:ro

volumes:
  datos-db:
  archivos:
